<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ชาดก ๕๐๐ ชาติ - นิทานสอนใจ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Prompt', sans-serif; 
            scroll-behavior: smooth; 
            overflow-x: hidden; 
            background-color: #FDFBF7; 
            color: #432C1A; 
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .snap-x { scroll-snap-type: x mandatory; }
        .snap-center { scroll-snap-align: center; }

        #sidebar { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .sidebar-open { transform: translateX(0); }
        .sidebar-closed { transform: translateX(-100%); }

        .modal-animate { animation: bounceIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        .hover-scale { transition: transform 0.2s ease; }
        .hover-scale:hover { transform: translateY(-4px); }

        .bg-app-primary { background-color: #E86A33; }
        .text-app-primary { color: #E86A33; }
        .border-app { border-color: #EED7B1; }
    </style>
</head>
<body class="flex min-h-screen">

    <!-- Sidebar (เมนูยุบขยาย) -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-[60] w-72 bg-white border-r border-app sidebar-closed md:sidebar-open shadow-xl md:shadow-none flex flex-col">
        <div class="p-6 flex items-center justify-between border-b border-app bg-orange-50/50">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-app-primary flex items-center justify-center shadow-md text-white text-xl">
                    🪷
                </div>
                <div>
                    <h1 class="font-bold text-lg text-orange-900 leading-tight">ชาดก ๕๐๐ ชาติ</h1>
                    <p class="text-xs text-orange-600 font-medium">คลังนิทานคุณธรรม</p>
                </div>
            </div>
            <button onclick="toggleSidebar()" class="md:hidden p-2 text-orange-800 bg-orange-100 rounded-full hover:bg-orange-200">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
        </div>

        <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
            <p class="px-4 text-xs font-semibold text-gray-400 mb-2 uppercase tracking-wider">เมนูหลัก</p>
            
            <button onclick="changeView('video')" id="side-video" class="w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl bg-orange-100 text-orange-800 font-semibold transition-all">
                <div class="p-2 bg-white rounded-xl shadow-sm side-icon-bg">
                    <svg class="h-5 w-5 text-orange-600 side-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                </div>
                <span>วิดีโอนิทาน</span>
            </button>

            <button onclick="changeView('book')" id="side-book" class="w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl text-gray-600 hover:bg-orange-50 font-medium transition-all">
                <div class="p-2 bg-gray-100 rounded-xl side-icon-bg">
                    <svg class="h-5 w-5 text-gray-500 side-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.247 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
                </div>
                <span>ห้องสมุดชาดก</span>
            </button>

            <div class="pt-4 mt-4 border-t border-orange-50">
                <a href="https://pdpa.pro/policies/view/th/4FM1QqDBTJkGBBva4fZvhvQ1" target="_blank" class="w-full flex items-center gap-4 px-4 py-3.5 rounded-2xl text-gray-500 hover:bg-gray-50 font-medium transition-all">
                    <div class="p-2 bg-gray-100 rounded-xl">
                        <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
                    </div>
                    <span>นโยบายส่วนตัว</span>
                </a>
            </div>
        </nav>

        <div class="p-5 border-t border-app bg-orange-50/30">
            <div class="bg-white rounded-xl p-3 shadow-sm flex items-center justify-center gap-2 border border-orange-100">
                <svg class="h-5 w-5 text-red-600" viewBox="0 0 24 24" fill="currentColor"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
                <span class="text-xs font-semibold text-gray-600 uppercase tracking-tighter">Powered by YouTube</span>
            </div>
        </div>
    </aside>

    <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/20 z-50 hidden md:hidden backdrop-blur-sm transition-opacity"></div>

    <div class="flex-1 flex flex-col md:ml-72 min-w-0 h-screen overflow-y-auto">
        <header class="sticky top-0 z-40 bg-[#FDFBF7]/90 backdrop-blur-md border-b border-app p-4 shadow-sm">
            <div class="max-w-5xl mx-auto flex items-center gap-4">
                <button onclick="toggleSidebar()" class="md:hidden p-2 text-orange-800 bg-white shadow-sm border border-orange-100 rounded-xl hover:bg-orange-50">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
                </button>
                <div class="flex-1 relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-400 group-focus-within:text-app-primary transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                    </div>
                    <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="ค้นหาชาดก..." 
                           class="w-full bg-white border border-gray-200 rounded-2xl py-3 pl-12 pr-4 focus:outline-none focus:border-app-primary focus:ring-2 focus:ring-orange-200 transition-all text-sm shadow-sm text-gray-700">
                </div>
            </div>
        </header>

        <main class="p-4 md:p-8 max-w-6xl mx-auto w-full pb-32">
            <div class="bg-gradient-to-r from-orange-400 to-amber-500 rounded-3xl p-6 md:p-8 mb-8 text-white shadow-lg relative overflow-hidden flex items-center">
                <div class="relative z-10">
                    <h2 id="viewTitle" class="text-2xl md:text-3xl font-bold mb-2">วิดีโอนิทานชาดก</h2>
                    <p id="viewSubtitle" class="text-orange-50 text-sm md:text-base">เลือกรับชมเรื่องราวคุณธรรมที่สอดแทรกคติสอนใจ</p>
                </div>
            </div>
            <div id="categoryContainer" class="space-y-10"></div>
            <div id="noResult" class="hidden text-center py-20 flex flex-col items-center justify-center text-gray-400">
                <p class="text-lg font-medium text-gray-500">ไม่พบข้อมูลที่ค้นหา</p>
            </div>
        </main>
    </div>

    <!-- Bottom Navigation (Mobile) -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-white/95 backdrop-blur-md border-t border-gray-100 px-2 py-2 pb-safe md:hidden shadow-[0_-4px_15px_rgba(0,0,0,0.05)]">
        <div class="flex justify-around items-center max-w-md mx-auto">
            <button id="nav-video" onclick="changeView('video')" class="flex flex-col items-center p-2 text-app-primary flex-1 transition-colors">
                <div class="bg-orange-100 p-1.5 rounded-xl mb-1 nav-icon-bg">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                </div>
                <span class="text-[10px] font-semibold">วิดีโอ</span>
            </button>
            <button id="nav-book" onclick="changeView('book')" class="flex flex-col items-center p-2 text-gray-400 flex-1 transition-colors">
                <div class="p-1.5 rounded-xl mb-1 nav-icon-bg">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.247 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
                </div>
                <span class="text-[10px] font-semibold">หนังสือ</span>
            </button>
            <button id="nav-fav" onclick="changeView('fav')" class="flex flex-col items-center p-2 text-gray-400 flex-1 transition-colors">
                <div class="p-1.5 rounded-xl mb-1 nav-icon-bg">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg>
                </div>
                <span class="text-[10px] font-semibold">รายการโปรด</span>
            </button>
        </div>
    </nav>

    <!-- Video Modal Player -->
    <div id="videoModal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/90 backdrop-blur-md p-4">
        <div class="relative w-full max-w-5xl aspect-video bg-gray-900 rounded-3xl overflow-hidden shadow-2xl modal-animate flex flex-col">
            <div class="flex justify-between items-center p-4 absolute top-0 left-0 right-0 z-20">
                <span id="playerTitle" class="text-white font-semibold truncate max-w-xs md:max-w-md">กำลังโหลด...</span>
                <button onclick="closeVideoModal()" class="p-2 bg-white/10 hover:bg-red-500 text-white rounded-full transition-colors border border-white/20">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
            </div>
            <div id="player" class="flex-1 w-full h-full"></div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // --- แหล่งข้อมูล CSV ---
        const videoCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS8iT7jQkM706x2ShINKLh13EZl2b5yyENbiz4DeW4H8qukELmQ-WuoP_ZqVA7iWciQ2QJIdRfQ9-uA/pub?output=csv';
        const bookCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS51xA526yWCgTdtsf64OQTijUWrahbB_AreeiTaGVPO0wY2ryz7yFM8rGTKbRKTUf3BSSBdsIPeCrA/pub?output=csv'; 

        let stories = [];
        let books = [];
        let favorites = JSON.parse(localStorage.getItem('jataka_favs_v3')) || [];
        let currentView = 'video';
        let ytPlayer;
        let currentIndex = -1;

        // ดึงไอดีวิดีโอ YouTube
        function getYTId(url) {
            if (!url) return 'dQw4w9WgXcQ';
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : 'dQw4w9WgXcQ';
        }

        // ฟังก์ชันสร้าง Thumbnail จาก Google Drive URL
        function getDriveThumbnail(url) {
            if (!url || !url.includes('drive.google.com')) return null;
            const match = url.match(/[-\w]{25,}/);
            if (match) {
                return `https://drive.google.com/thumbnail?id=${match[0]}&sz=w600`;
            }
            return null;
        }

        // ฟังก์ชันจัดการรูปภาพโหลดเสีย (ป้องกัน Syntax Error จากการเขียน String ซ้อนกันใน HTML)
        function handleImgLoadError(el, type) {
            if (type === 'book') {
                el.parentElement.innerHTML = '<div class="bg-orange-50 w-full h-full flex items-center justify-center"><svg class="h-12 w-12 text-orange-200" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.247 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg></div>';
            } else {
                el.src = 'https://via.placeholder.com/640x360?text=No+Image';
            }
        }

        // ฟังก์ชันแยก CSV ที่แม่นยำ
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());
            return result;
        }

        async function initData() {
            try {
                // โหลดข้อมูลวิดีโอ
                if (videoCsvUrl) {
                    const response = await fetch(videoCsvUrl);
                    const text = await response.text();
                    let rows = text.split(/\r?\n/).filter(l => l.trim() !== '').map(parseCSVLine);
                    // ข้าม Header
                    if (rows.length > 0 && rows[0][0].toLowerCase().includes('category')) rows.shift();

                    stories = rows.map((p, i) => ({
                        id: 'v' + i,
                        type: 'video',
                        cat: p[0] || 'ทั่วไป',
                        title: p[1] || 'ไม่มีชื่อเรื่อง',
                        mediaUrl: p[2] || '',
                        imageUrl: p[3] || null,
                        ytId: getYTId(p[2])
                    }));
                }

                // โหลดข้อมูลหนังสือ
                if (bookCsvUrl) {
                    const response = await fetch(bookCsvUrl);
                    const text = await response.text();
                    let rows = text.split(/\r?\n/).filter(l => l.trim() !== '').map(parseCSVLine);
                    if (rows.length > 0 && (rows[0][0].toLowerCase().includes('category') || rows[0][0].includes('หมวด'))) rows.shift();

                    books = rows.map((p, i) => {
                        const url = p[2] || '#';
                        return {
                            id: 'b' + i,
                            type: 'book',
                            cat: p[0] || 'ทั่วไป',
                            title: p[1] || 'ไม่มีชื่อหนังสือ',
                            url: url,
                            imageUrl: (p[3] && p[3].trim() !== '') ? p[3] : getDriveThumbnail(url)
                        };
                    });
                }

                renderContent();
            } catch (error) {
                console.error("Fetch Error:", error);
                renderContent();
            }
        }

        function renderContent(data = null) {
            const container = document.getElementById('categoryContainer');
            container.innerHTML = '';
            const allItems = [...stories, ...books];
            let displayData = data || (currentView === 'video' ? stories : (currentView === 'book' ? books : allItems.filter(s => favorites.includes(s.id))));
            
            if (!displayData.length) {
                document.getElementById('noResult').classList.remove('hidden');
                return;
            }
            document.getElementById('noResult').classList.add('hidden');

            const groups = displayData.reduce((acc, item) => {
                if (!acc[item.cat]) acc[item.cat] = [];
                acc[item.cat].push(item);
                return acc;
            }, {});

            Object.keys(groups).forEach(cat => {
                const items = groups[cat];
                const section = document.createElement('div');
                section.className = "category-section bg-white rounded-3xl p-4 md:p-6 shadow-sm border border-orange-50/50";
                section.innerHTML = `
                    <div class="flex items-center justify-between mb-4 px-2">
                        <div class="flex items-center gap-3">
                            <div class="w-2 h-6 bg-[#E86A33] rounded-full"></div>
                            <h3 class="text-lg md:text-xl font-bold text-[#432C1A]">${cat}</h3>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="scrollLeftBtn(this)" class="p-2 bg-gray-50 rounded-full border border-gray-100 hover:bg-orange-50 transition-colors text-gray-400"><svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg></button>
                            <button onclick="scrollRightBtn(this)" class="p-2 bg-gray-50 rounded-full border border-gray-100 hover:bg-orange-50 transition-colors text-gray-400"><svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg></button>
                        </div>
                    </div>
                    <div class="flex overflow-x-auto snap-x no-scrollbar gap-4 pb-4 scroll-container">
                        ${items.map(item => renderCard(item)).join('')}
                    </div>
                `;
                container.appendChild(section);
            });
        }

        function renderCard(item) {
            const isFav = favorites.includes(item.id);
            const favClass = isFav ? 'text-red-500 fill-red-500' : 'text-gray-300';
            
            let displayImg;
            if (item.imageUrl && item.imageUrl.trim() !== '') {
                displayImg = `<img src="${item.imageUrl}" class="w-full h-full object-cover" onerror="handleImgLoadError(this, '${item.type}')">`;
            } else if (item.type === 'video') {
                displayImg = `<img src="https://img.youtube.com/vi/${item.ytId}/mqdefault.jpg" class="w-full h-full object-cover" onerror="handleImgLoadError(this, 'video')">`;
            } else {
                displayImg = `<div class="bg-orange-50 w-full h-full flex items-center justify-center"><svg class="h-12 w-12 text-orange-200" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.247 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg></div>`;
            }

            if (item.type === 'book') {
                return `
                    <div class="snap-center shrink-0 w-44 md:w-52 bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-sm relative flex flex-col hover-scale">
                        <button onclick="toggleFav(event, '${item.id}')" class="absolute top-3 right-3 z-10 p-2 rounded-full bg-white/90 shadow-sm"><svg class="h-4 w-4 ${favClass}" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg></button>
                        <div class="aspect-[3/4] overflow-hidden bg-gray-100">${displayImg}</div>
                        <div class="p-3 flex-1 flex flex-col justify-between border-t border-gray-50"><h4 class="text-xs font-bold line-clamp-2 mb-2 h-8 leading-tight text-[#432C1A]">${item.title}</h4><a href="${item.url}" target="_blank" class="block w-full py-2 text-[10px] text-center bg-orange-100 text-orange-800 font-bold rounded-lg hover:bg-orange-500 hover:text-white transition-colors">อ่านเลย</a></div>
                    </div>`;
            }
            return `
                <div class="snap-center shrink-0 w-64 md:w-72 bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-sm group relative hover-scale">
                    <button onclick="toggleFav(event, '${item.id}')" class="absolute top-2 right-2 z-10 p-2 rounded-full bg-white/80 shadow-sm"><svg class="h-4 w-4 ${favClass}" viewBox="0 0 24 24" stroke="currentColor"><path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg></button>
                    <div class="aspect-video cursor-pointer relative overflow-hidden" onclick="playVideo('${item.id}')">
                        ${displayImg}
                        <div class="absolute inset-0 flex items-center justify-center bg-black/10 group-hover:bg-black/30 transition-colors"><div class="bg-white/90 p-2 rounded-full text-[#E86A33] shadow-lg"><svg class="h-6 w-6" fill="currentColor" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168l4.2 2.4a1 1 0 010 1.732l-4.2 2.4A1 1 0 018 12.832V7.168a1 1 0 011.555-.832z" /></svg></div></div>
                    </div>
                    <div class="p-3 border-t border-gray-50"><h4 class="text-xs md:text-sm font-bold line-clamp-1 text-[#432C1A]">${item.title}</h4></div>
                </div>`;
        }

        function changeView(view) {
            currentView = view;
            const titles = { video: 'วิดีโอนิทานชาดก', book: 'ห้องสมุดชาดก', fav: 'รายการโปรดของฉัน' };
            const subtitles = { video: 'เลือกรับชมเรื่องราวคุณธรรมที่สอดแทรกคติสอนใจ', book: 'รวมหนังสือนิทานภาพและการ์ตูนสำหรับอ่าน', fav: 'เรื่องราวที่คุณชื่นชอบและบันทึกเก็บไว้' };
            
            document.getElementById('viewTitle').innerText = titles[view];
            document.getElementById('viewSubtitle').innerText = subtitles[view];
            
            ['video', 'book', 'fav'].forEach(v => {
                const sideBtn = document.getElementById(`side-${v}`);
                const navBtn = document.getElementById(`nav-${v}`);
                if (navBtn) {
                    const navIconBg = navBtn.querySelector('.nav-icon-bg');
                    if (v === view) {
                        navBtn.classList.add('text-app-primary');
                        navBtn.classList.remove('text-gray-400');
                        navIconBg?.classList.add('bg-orange-100');
                    } else {
                        navBtn.classList.remove('text-app-primary');
                        navBtn.classList.add('text-gray-400');
                        navIconBg?.classList.remove('bg-orange-100');
                    }
                }
                
                if (sideBtn) {
                    const sideIconBg = sideBtn.querySelector('.side-icon-bg');
                    const sideIcon = sideBtn.querySelector('.side-icon');
                    if (v === view) {
                        sideBtn.classList.add('bg-orange-100', 'text-orange-800', 'font-semibold');
                        sideBtn.classList.remove('text-gray-600', 'font-medium');
                        sideIconBg?.classList.add('bg-white', 'shadow-sm');
                        sideIcon?.classList.add('text-orange-600');
                        sideIcon?.classList.remove('text-gray-500');
                    } else {
                        sideBtn.classList.remove('bg-orange-100', 'text-orange-800', 'font-semibold');
                        sideBtn.classList.add('text-gray-600', 'font-medium');
                        sideIconBg?.classList.remove('bg-white', 'shadow-sm');
                        sideIcon?.classList.add('text-gray-500');
                        sideIcon?.classList.remove('text-orange-600');
                    }
                }
            });

            renderContent();
            if (window.innerWidth < 768) toggleSidebar(true);
        }

        function toggleSidebar(forceClose = false) {
            const sb = document.getElementById('sidebar');
            const ov = document.getElementById('sidebarOverlay');
            if (forceClose) {
                sb.classList.replace('sidebar-open', 'sidebar-closed');
                ov.classList.add('hidden');
            } else {
                sb.classList.toggle('sidebar-closed');
                sb.classList.toggle('sidebar-open');
                ov.classList.toggle('hidden');
            }
        }

        function toggleFav(e, id) {
            e.stopPropagation();
            const idx = favorites.indexOf(id);
            if (idx > -1) favorites.splice(idx, 1);
            else favorites.push(id);
            localStorage.setItem('jataka_favs_v2', JSON.stringify(favorites));
            renderContent();
        }

        function handleSearch(v) {
            const q = v.toLowerCase().trim();
            const all = [...stories, ...books];
            const src = currentView === 'book' ? books : (currentView === 'video' ? stories : all.filter(s => favorites.includes(s.id)));
            renderContent(src.filter(s => s.title.toLowerCase().includes(q) || s.cat.toLowerCase().includes(q)));
        }

        function scrollLeftBtn(b) { b.closest('.category-section').querySelector('.scroll-container').scrollBy({ left: -300, behavior: 'smooth' }); }
        function scrollRightBtn(b) { b.closest('.category-section').querySelector('.scroll-container').scrollBy({ left: 300, behavior: 'smooth' }); }

        function onYouTubeIframeAPIReady() {}
        function playVideo(id) {
            currentIndex = stories.findIndex(s => s.id === id);
            const s = stories[currentIndex];
            if (!s) return;
            document.getElementById('videoModal').classList.replace('hidden', 'flex');
            document.getElementById('playerTitle').innerText = s.title;
            if (!ytPlayer) ytPlayer = new YT.Player('player', { videoId: s.ytId, playerVars: { autoplay: 1, playsinline: 1, modestbranding: 1 }, events: { onStateChange: e => e.data === 0 && playNext() } });
            else ytPlayer.loadVideoById(s.ytId);
        }
        function playNext() { currentIndex++; if (currentIndex >= stories.length) currentIndex = 0; playVideo(stories[currentIndex].id); }
        function closeVideoModal() { document.getElementById('videoModal').classList.replace('flex', 'hidden'); ytPlayer?.stopVideo(); document.body.style.overflow = 'auto'; }

        window.onload = initData;
    </script>
</body>
</html>
